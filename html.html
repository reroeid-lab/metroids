<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catch the falling stars</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a2e;
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        #game-container {
            text-align: center;
            position: relative;
        }

        h1 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #stats {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin: 0 auto 10px;
            font-size: 18px;
            font-weight: bold;
            color: #00d2ff;
        }

        canvas {
            background-color: #16213e;
            border: 2px solid #0f3460;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            display: block;
        }

        #controls {
            margin-top: 15px;
            color: #a0a0a0;
            font-size: 14px;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(15, 52, 96, 0.95);
            padding: 30px;
            border-radius: 10px;
            border: 2px splid #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
            z-index: 10;
        }
    </style>
</head>
<body>
    
</body>
</html>
